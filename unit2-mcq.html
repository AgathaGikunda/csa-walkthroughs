<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AP Comp Sci Unit 2 MCQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #eef1f6; --surface: #ffffff; --ink: #1b2232; --muted: #5a6478; --rule: #d7dde8;
  --accent: #2c56c9; --hl: #ffe27a; --hl-ink: #1b2232; --focus: #e6edff;
  --kw: #2c56c9; --str: #1d7a52; --num: #a24a12; --cm: #6b7385;
  --good: #1d7a52; --good-bg: #dff3e8; --bad: #b3261e; --bad-bg: #fde4e1;
  --chg: #fff1b8;
  --font-text: "Atkinson Hyperlegible", "Segoe UI", Verdana, sans-serif;
  --font-code: "JetBrains Mono", Consolas, "Courier New", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #10141d; --surface: #181e2b; --ink: #e8ecf4; --muted: #9ba6ba; --rule: #2a3245;
    --accent: #8eaeff; --hl: #5b4a10; --hl-ink: #fff2c2; --focus: #1e2a46;
    --kw: #8eaeff; --str: #6fd3a4; --num: #f0a36b; --cm: #8a93a6;
    --good: #6fd3a4; --good-bg: #133526; --bad: #ff9c8f; --bad-bg: #3d1a17; --chg: #4a3d0e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #10141d; --surface: #181e2b; --ink: #e8ecf4; --muted: #9ba6ba; --rule: #2a3245;
  --accent: #8eaeff; --hl: #5b4a10; --hl-ink: #fff2c2; --focus: #1e2a46;
  --kw: #8eaeff; --str: #6fd3a4; --num: #f0a36b; --cm: #8a93a6;
  --good: #6fd3a4; --good-bg: #133526; --bad: #ff9c8f; --bad-bg: #3d1a17; --chg: #4a3d0e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-text);
  font-size: clamp(15px, 1.2vw, 19px); line-height: 1.45;
  padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
}
.app { max-width: 1400px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px; }
header h1 { font-size: 1.35em; margin: 0; }
.home { color: var(--accent); font-weight: 700; text-decoration: none; }
.home:hover { text-decoration: underline; }
.spacer { flex: 1; }
.hint { color: var(--muted); font-size: 0.85em; }
nav.qs { display: flex; flex-wrap: wrap; gap: 6px; }
.qbtn {
  font: inherit; font-weight: 700; min-width: 2.6em; padding: 6px 10px; border-radius: 999px; cursor: pointer;
  border: 2px solid var(--rule); background: var(--surface); color: var(--ink); font-variant-numeric: tabular-nums;
}
.qbtn[aria-current="true"] { border-color: var(--accent); background: var(--accent); color: var(--surface); }
.qbtn.done:not([aria-current="true"]) { border-color: var(--good); }
code, .mono { font-family: var(--font-code); font-size: 0.92em; }
.grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
.pane { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; min-width: 0; }
.pane h2 { margin: 0 0 10px; font-size: 0.8em; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.skill { display: inline-block; font-size: 0.8em; font-weight: 700; color: var(--accent); margin-bottom: 6px; }
.prompt p { margin: 0 0 10px; }
.prompt ul { margin: 0 0 10px; padding-left: 1.3em; }
.blk { margin: 0 0 12px; }
.blk .lab { font-weight: 700; font-size: 0.9em; margin-bottom: 4px; }
.code { border: 1px solid var(--rule); border-radius: 8px; padding: 8px 0; overflow-x: auto; background: var(--bg); }
.ln { display: grid; grid-template-columns: 2.4em max-content; padding: 1px 14px 1px 0; border-left: 4px solid transparent; transition: background-color .2s; }
.ln .no { color: var(--muted); text-align: right; padding-right: 0.8em; font-family: var(--font-code); font-size: 0.78em; padding-top: 0.2em; user-select: none; }
.ln .tx { font-family: var(--font-code); white-space: pre; font-size: 0.95em; }
.ln.now { background: var(--hl); color: var(--hl-ink); border-left-color: var(--accent); }
.ln.now .no, .ln.now .kw, .ln.now .str, .ln.now .num, .ln.now .cm { color: inherit; }
.kw { color: var(--kw); font-weight: 600; }
.str { color: var(--str); }
.num { color: var(--num); }
.cm { color: var(--cm); font-style: italic; }
.choices { display: grid; gap: 8px; }
.choices.wide { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 700px) { .choices.wide { grid-template-columns: minmax(0, 1fr); } }
.choice {
  text-align: left; font: inherit; color: inherit; background: var(--surface); cursor: pointer;
  border: 2px solid var(--rule); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  transition: border-color .2s, background-color .2s;
}
.choice:hover { border-color: var(--muted); }
.choice .top { display: flex; align-items: baseline; gap: 10px; }
.choice .let { font-weight: 700; }
.choice .tag { margin-left: auto; font-size: 0.75em; font-weight: 700; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.choice.focus { border-color: var(--accent); background: var(--focus); }
.choice.picked .tag.you { background: var(--rule); color: var(--ink); }
.choice.correct { border-color: var(--good); background: var(--good-bg); }
.choice.correct .tag.ans { background: var(--good); color: var(--surface); }
.choice.wrong { border-color: var(--bad); background: var(--bad-bg); }
.choice .steps-list { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.choice .steps-list li { padding: 2px 6px; border-radius: 4px; border-left: 4px solid transparent; }
.choice .steps-list li.now { background: var(--hl); color: var(--hl-ink); border-left-color: var(--accent); }
.choice .code { background: transparent; }
.choice .ln .tx { font-size: 0.84em; }
.choice .ln { padding-right: 8px; }
.trace { position: sticky; top: 12px; display: flex; flex-direction: column; gap: 12px; }
.vars { display: flex; flex-wrap: wrap; gap: 8px; min-height: 2.4em; }
.var { border: 1px solid var(--rule); border-radius: 8px; padding: 4px 10px; display: flex; gap: 8px; align-items: baseline; transition: background-color .3s; }
.var .k { color: var(--muted); font-size: 0.85em; }
.var .v { font-family: var(--font-code); font-weight: 600; }
.var.chg { background: var(--chg); }
.novars { color: var(--muted); font-style: italic; }
.say { font-size: 1.12em; min-height: 4.5em; }
.say p { margin: 0 0 8px; }
.stepno { color: var(--accent); font-weight: 700; font-size: 0.8em; letter-spacing: 0.08em; text-transform: uppercase; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; }
.btn {
  font: inherit; font-weight: 700; padding: 9px 16px; border-radius: 8px; cursor: pointer;
  border: 2px solid var(--rule); background: var(--surface); color: var(--ink);
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:focus-visible, .qbtn:focus-visible, .choice:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.bar { height: 6px; background: var(--rule); border-radius: 3px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); transition: width .25s; }
.reveal { border: 2px solid var(--good); background: var(--good-bg); border-radius: 10px; padding: 12px 14px; }
.reveal .big { font-weight: 700; font-size: 1.15em; margin-bottom: 4px; }
.reveal p { margin: 0; }
.verdict { font-weight: 700; margin-top: 8px; }
.verdict.ok { color: var(--good); }
.verdict.no { color: var(--bad); }
@media (max-width: 900px) {
  .trace { top: auto; bottom: 8px; max-height: 46vh; overflow-y: auto; box-shadow: 0 -6px 24px rgba(0,0,0,.18); gap: 8px; padding: 12px 14px; }
  .trace h2 { display: none; }
  .say { min-height: 0; font-size: 1em; }
  .btn { padding: 7px 12px; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <a class="home" href="index.html">← All walkthroughs</a>
    <h1>AP Comp Sci Unit 2 · Multiple Choice</h1>
    <span class="spacer"></span>
    <span class="hint">Pick your answer, then trace it. Keys: ← → steps · [ ] questions</span>
  </header>
  <nav class="qs" id="qs" aria-label="Questions"></nav>
  <div class="grid">
    <section class="pane" aria-labelledby="qtitle">
      <h2 id="qtitle">Question</h2>
      <div id="question"></div>
    </section>
    <section class="pane trace" aria-label="Trace">
      <div>
        <h2>Variables and values</h2>
        <div class="vars" id="vars"></div>
      </div>
      <div class="bar" aria-hidden="true"><div id="barfill"></div></div>
      <div aria-live="polite">
        <div class="stepno" id="stepno"></div>
        <div class="say" id="say"></div>
      </div>
      <div class="controls">
        <button class="btn" id="back">← Back</button>
        <button class="btn primary" id="next">Next →</button>
        <button class="btn" id="jump">Show answer</button>
        <button class="btn" id="restart">Start over</button>
      </div>
    </section>
  </div>
</div>
<script>
const Q = [];
const add = q => Q.push(q);

/* ---------- 1 ---------- */
add({
  skill: "Algorithms: putting three values in order with swaps",
  prompt: `<p>The variables <code>x</code>, <code>y</code>, and <code>z</code> are integers. Which of the following algorithms can be used to swap the values of the variables so that they are ordered from <b>greatest to least</b> (that is, <code>x &gt;= y &gt;= z</code>)?</p>`,
  choices: {
    A: { lines: ["Step 1: If <code>x</code> is less than <code>y</code>, swap <code>x</code> and <code>y</code>.", "Step 2: If <code>y</code> is less than <code>z</code>, swap <code>y</code> and <code>z</code>."] },
    B: { lines: ["Step 1: If <code>x</code> is less than <code>y</code>, swap <code>x</code> and <code>y</code>.", "Step 2: If <code>y</code> is less than <code>z</code>, swap <code>y</code> and <code>z</code>.", "Step 3: If <code>x</code> is less than <code>y</code>, swap <code>x</code> and <code>y</code>."] },
    C: { lines: ["Step 1: If <code>x</code> is less than <code>z</code>, swap <code>x</code> and <code>z</code>.", "Step 2: If <code>y</code> is less than <code>z</code>, swap <code>y</code> and <code>z</code>."] },
    D: { lines: ["Step 1: If <code>x</code> is less than <code>y</code>, swap <code>x</code> and <code>y</code>.", "Step 2: If <code>y</code> is less than <code>z</code>, swap <code>y</code> and <code>z</code>.", "Step 3: If <code>x</code> is less than <code>z</code>, swap <code>x</code> and <code>z</code>."] }
  },
  answer: "B",
  steps: [
    { vars: { x: 1, y: 2, z: 3 }, say: "Pick a test case that starts in the worst order: <code>x = 1</code>, <code>y = 2</code>, <code>z = 3</code>. The goal is 3, 2, 1." },
    { ch: ["B"], hl: ["B-0"], vars: { x: 2, y: 1, z: 3 }, say: "(B) Step 1: is x less than y? 1 &lt; 2, yes. Swap them." },
    { ch: ["B"], hl: ["B-1"], vars: { x: 2, y: 3, z: 1 }, say: "(B) Step 2: is y less than z? 1 &lt; 3, yes. Swap. The smallest value is now at the end, but x and y are out of order: 2, 3." },
    { ch: ["B"], hl: ["B-2"], vars: { x: 3, y: 2, z: 1 }, say: "(B) Step 3: is x less than y? 2 &lt; 3, yes. Swap. Now 3, 2, 1. Sorted." },
    { ch: ["A"], hl: ["A-0", "A-1"], vars: { x: 2, y: 3, z: 1 }, say: "(A) has the same first two steps, so it ends at 2, 3, 1. It stops before fixing x and y." },
    { ch: ["D"], hl: ["D-2"], vars: { x: 2, y: 3, z: 1 }, say: "(D) also reaches 2, 3, 1 after two steps. Step 3 compares x and z: is 2 &lt; 1? No. Nothing changes, so it is still 2, 3, 1." },
    { ch: ["C"], hl: ["C-0", "C-1"], vars: { x: 2, y: 3, z: 1 }, say: "(C) fails when you start with 1, 3, 2. Step 1: 1 &lt; 2, swap x and z → 2, 3, 1. Step 2: is 3 &lt; 1? No. It ends at 2, 3, 1." }
  ],
  why: "Comparing x and y, then y and z, moves the smallest value into <code>z</code>. The third step compares x and y again, because the second swap may have put a bigger value into <code>y</code>. (A) stops too early. (C) fails for 1, 3, 2. (D) compares x and z in the last step, which doesn’t fix x and y."
});

/* ---------- 2 ---------- */
add({
  skill: "Algorithms: steps with “skip” to choose a category",
  prompt: `<p>A game ranks each player at the end of a level:</p><ul><li>A score less than 50 is ranked “Bronze.”</li><li>A score of 50 or more is ranked “Silver” if the player had at least one miss.</li><li>A score of 50 or more with no misses is ranked “Gold.”</li></ul><p>Which of the following algorithms will correctly rank a player?</p>`,
  choices: {
    A: { lines: ["Step 1: If the score is 50 or more, label it “Silver” and skip Steps 2 and 3. Otherwise, go to Step 2.", "Step 2: If the player has no misses, label it “Gold” and skip Step 3. Otherwise, go to Step 3.", "Step 3: Label it “Bronze.”"] },
    B: { lines: ["Step 1: If the player has no misses, label it “Gold” and skip Steps 2 and 3. Otherwise, go to Step 2.", "Step 2: If the score is 50 or more, label it “Silver” and skip Step 3. Otherwise, go to Step 3.", "Step 3: Label it “Bronze.”"] },
    C: { lines: ["Step 1: If the score is less than 50, label it “Bronze” and skip Steps 2 and 3. Otherwise, go to Step 2.", "Step 2: If the player has at least one miss, label it “Silver” and skip Step 3. Otherwise, go to Step 3.", "Step 3: Label it “Gold.”"] },
    D: { lines: ["Step 1: If the score is more than 50 and the player has no misses, label it “Gold” and skip Steps 2 and 3. Otherwise, go to Step 2.", "Step 2: If the score is more than 50, label it “Silver” and skip Step 3. Otherwise, go to Step 3.", "Step 3: Label it “Bronze.”"] }
  },
  wide: true,
  answer: "C",
  steps: [
    { vars: { score: 50, misses: 0, "should be": "Gold" }, say: "Test with the tricky cases. First: a score of exactly 50 with no misses. That should be Gold." },
    { ch: ["C"], hl: ["C-0"], vars: { score: 50, misses: 0, "should be": "Gold" }, say: "(C) Step 1: is 50 less than 50? No. Go to Step 2." },
    { ch: ["C"], hl: ["C-1"], vars: { score: 50, misses: 0, "should be": "Gold" }, say: "(C) Step 2: at least one miss? No. Go to Step 3." },
    { ch: ["C"], hl: ["C-2"], vars: { score: 50, misses: 0, "should be": "Gold", label: "Gold" }, say: "(C) Step 3: Gold. Correct." },
    { ch: ["C"], hl: ["C-0"], vars: { score: 40, misses: 0, "should be": "Bronze", label: "Bronze" }, say: "Second case: 40 with no misses. (C) Step 1: 40 &lt; 50, so Bronze, and it skips the rest. Correct." },
    { ch: ["A"], hl: ["A-0"], vars: { score: 50, misses: 0, "should be": "Gold", label: "Silver" }, say: "(A) with 50 and no misses: Step 1 says 50 or more → Silver. Wrong. In (A), nobody can ever reach Gold." },
    { ch: ["B"], hl: ["B-0"], vars: { score: 40, misses: 0, "should be": "Bronze", label: "Gold" }, say: "(B) with 40 and no misses: Step 1 says no misses → Gold. Wrong, a low score should be Bronze." },
    { ch: ["D"], hl: ["D-0", "D-1", "D-2"], vars: { score: 50, misses: 0, "should be": "Gold", label: "Bronze" }, say: "(D) with 50 and no misses: “more than 50” is false in Step 1 and in Step 2, so it falls to Bronze. Wrong, 50 should count." }
  ],
  why: "Low scores are handled first, then a miss means Silver, and only a score of 50 or more with no misses reaches Gold. (A) labels every score of 50 or more as Silver. (B) gives Gold to a low score with no misses. (D) uses “more than 50”, so exactly 50 gets Bronze."
});

/* ---------- 3 ---------- */
add({
  skill: "while loop: digits of an integer with % 10 and / 10",
  prompt: `<p>Consider the following code segment.</p>`,
  code: [{ src: `int n = 4072;
int sum = 0;
while (n > 0)
{
    sum += n % 10;
    n /= 10;
}
System.out.println(sum);` }],
  post: `<p>What is printed as a result of executing this code segment?</p>`,
  choices: { A: { c: "13" }, B: { c: "9" }, C: { c: "2" }, D: { c: "4072" } },
  answer: "A",
  steps: [
    { hl: ["Q0-0", "Q0-1"], vars: { n: 4072, sum: 0 }, say: "Start: n is 4072 and sum is 0." },
    { hl: ["Q0-2"], vars: { n: 4072, sum: 0 }, say: "Is 4072 &gt; 0? Yes, go into the loop." },
    { hl: ["Q0-4"], vars: { n: 4072, sum: 2 }, say: "<code>4072 % 10</code> is 2, the last digit. sum becomes 2." },
    { hl: ["Q0-5"], vars: { n: 407, sum: 2 }, say: "<code>4072 / 10</code> is 407. Integer division drops the last digit." },
    { hl: ["Q0-4", "Q0-5"], vars: { n: 40, sum: 9 }, say: "Second pass: <code>407 % 10</code> is 7, so sum is 9. n becomes 40." },
    { hl: ["Q0-4", "Q0-5"], vars: { n: 4, sum: 9 }, say: "Third pass: <code>40 % 10</code> is 0, so sum stays 9. n becomes 4." },
    { hl: ["Q0-4", "Q0-5"], vars: { n: 0, sum: 13 }, say: "Fourth pass: <code>4 % 10</code> is 4, so sum is 13. n becomes 0." },
    { hl: ["Q0-2"], vars: { n: 0, sum: 13 }, say: "Is 0 &gt; 0? No. The loop ends." },
    { hl: ["Q0-7"], vars: { n: 0, sum: 13, printed: "13" }, say: "It prints 13. That is 2 + 7 + 0 + 4, the sum of the digits." }
  ],
  why: "Each pass adds the last digit (<code>n % 10</code>) and then removes it (<code>n /= 10</code>): 2, 7, 0, 4, which adds up to 13. (B) is what you get if the loop stops early and misses the 4. (C) is only the last digit."
});

/* ---------- 4 ---------- */
add({
  skill: "Finding a test case that shows a bug",
  prompt: `<p>Consider the following code segment, which is intended to print <code>true</code> only when both <code>a</code> and <code>b</code> are <b>negative</b>. Assume that <code>a</code> and <code>b</code> are properly declared and initialized <code>int</code> variables.</p>`,
  code: [{ src: `boolean aNeg = a < 0;
boolean bNeg = b < 0;
System.out.println(aNeg == bNeg);` }],
  post: `<p>The code segment does not always work as intended. Which of the following values for <code>a</code> and <code>b</code> will demonstrate that the code segment does <b>not</b> work as intended?</p>`,
  choices: { A: { c: "a = -4, b = -9" }, B: { c: "a = -2, b = 6" }, C: { c: "a = 5, b = -1" }, D: { c: "a = 3, b = 8" } },
  answer: "D",
  steps: [
    { say: "A value shows the bug when what the code prints is different from what it should print. Try each choice." },
    { ch: ["A"], hl: ["Q0-0", "Q0-1", "Q0-2"], vars: { a: -4, b: -9, aNeg: true, bNeg: true, prints: true, "should print": true }, say: "(A) Both are negative. <code>true == true</code> prints true. That is what we want." },
    { ch: ["B"], hl: ["Q0-2"], vars: { a: -2, b: 6, aNeg: true, bNeg: false, prints: false, "should print": false }, say: "(B) <code>true == false</code> prints false. Correct." },
    { ch: ["C"], hl: ["Q0-2"], vars: { a: 5, b: -1, aNeg: false, bNeg: true, prints: false, "should print": false }, say: "(C) <code>false == true</code> prints false. Correct." },
    { ch: ["D"], hl: ["Q0-2"], vars: { a: 3, b: 8, aNeg: false, bNeg: false, prints: true, "should print": false }, say: "(D) Neither is negative, so both are false. <code>false == false</code> is <b>true</b>! It prints true when it should print false. This is the bug." }
  ],
  why: "<code>==</code> checks whether the two are the same, not whether both are true. With <code>a = 3, b = 8</code>, both variables are false, so <code>aNeg == bNeg</code> is true. A correct version would use <code>aNeg &amp;&amp; bNeg</code>."
});

/* ---------- 5 ---------- */
add({
  skill: "!, != and boolean variables",
  prompt: `<p>In the following code segment, <code>p</code> and <code>q</code> are properly declared and initialized <code>boolean</code> variables.</p>`,
  code: [{ src: `boolean result = !(p != q);
System.out.println(result);` }],
  post: `<p>Which of the following best describes the behavior of the code segment?</p>`,
  choices: {
    A: { t: "It prints <code>true</code> if <code>p</code> is <code>true</code> and <code>q</code> is <code>false</code>, and prints <code>false</code> otherwise." },
    B: { t: "It prints <code>true</code> if <code>p</code> and <code>q</code> have the same value, and prints <code>false</code> otherwise." },
    C: { t: "It prints <code>true</code> if <code>p</code> and <code>q</code> have different values, and prints <code>false</code> otherwise." },
    D: { t: "It prints <code>false</code> for all possible values of <code>p</code> and <code>q</code>." }
  },
  answer: "B",
  steps: [
    { hl: ["Q0-0"], say: "Two booleans can only be in 4 combinations. Try all of them." },
    { hl: ["Q0-0"], vars: { p: true, q: true, "p != q": false, result: true }, say: "Both true: they are the same, so <code>p != q</code> is false. The <code>!</code> flips it to true." },

    System.out.println("Fourth");
}` }],
  post: `<p>Which of the following is <b>always</b> printed as a result of executing this code segment?</p>`,

  steps: [
    { hl: ["Q0-1"], say: "Use De Morgan on b. <code>!(X &amp;&amp; Y)</code> becomes <code>!X || !Y</code>. So <code>!(!f &amp;&amp; n &gt;= 10)</code> becomes <code>f || n &lt; 10</code>." },

add({
  skill: "De Morgan’s laws: negating a compound condition",
  prompt: `<p>A garden app decides when a plant needs water. A plant needs water when its soil moisture is less than 30, the temperature is more than 25, <b>and</b> the humidity is less than 40.</p><p>Assume that <code>moisture</code>, <code>temp</code>, and <code>humidity</code> are properly declared and initialized <code>int</code> variables. Which of the following expressions will evaluate to <code>true</code> exactly when a plant needs water?</p>`,

    { ch: ["D"], vars: { moisture: 20, temp: 30, humidity: 35, result: true, "should be": true }, say: "Check (D) with a dry, hot day: 20, 30, 35. It needs water, and (D) is true." },

    { ch: ["A"], vars: { moisture: 20, temp: 30, humidity: 35, result: false, "should be": true }, say: "(A) is the exact opposite of the rule. It is true when the plant does <b>not</b> need water." },

  code: [{ src: `boolean different = false;                    // line 1
if (word1 != null && word2 != null)           // line 2
{

System.out.println(different);` }],

/* ================= engine ================= */
const KW = /\b(int|double|boolean|String|if|else|while|for|return|true|false|null|new|void|public)\b/;
const TOK = /(\/\/.*$|\/\*.*?\*\/)|("(?:[^"\\]|\\.)*")|\b(int|double|boolean|String|if|else|while|for|return|true|false|null|new|void|public)\b|\b(\d+(?:\.\d+)?)\b/g;
const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function hl(line) {
  let out = "", last = 0, m;
  TOK.lastIndex = 0;
  while ((m = TOK.exec(line))) {
    out += esc(line.slice(last, m.index));
    const cls = m[1] ? "cm" : m[2] ? "str" : m[3] ? "kw" : "num";
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = TOK.lastIndex;
  }
  return out + esc(line.slice(last));
}
function codeBlock(src, key) {
  return `<div class="code">` + src.split("\n").map((l, i) =>
    `<div class="ln" data-k="${key}-${i}"><span class="no">${i + 1}</span><span class="tx">${hl(l) || " "}</span></div>`
  ).join("") + `</div>`;
}

const state = { q: 0, s: 0, picks: {}, done: {} };
const $ = id => document.getElementById(id);

function buildNav() {
  $("qs").innerHTML = Q.map((_, i) => `<button class="qbtn" data-q="${i}" aria-label="Question ${i + 1}">${i + 1}</button>`).join("");
  $("qs").addEventListener("click", e => { const b = e.target.closest(".qbtn"); if (b) go(+b.dataset.q, 0); });
}

function renderQuestion() {
  const q = Q[state.q];
  $("qtitle").textContent = `Question ${state.q + 1} of ${Q.length}`;
  let h = `<span class="skill">${q.skill}</span><div class="prompt">${q.prompt}</div>`;
  (q.code || []).forEach((b, i) => {
    h += `<div class="blk">${b.label ? `<div class="lab">${b.label}</div>` : ""}${codeBlock(b.src, "Q" + i)}</div>`;
  });
  if (q.post) h += `<div class="prompt">${q.post}</div>`;
  h += `<div class="choices${q.wide ? " wide" : ""}" role="group" aria-label="Answer choices">`;
  for (const L of ["A", "B", "C", "D"]) {
    const c = q.choices[L];
    let body = "";
    if (c.c) body = `<code>${esc(c.c)}</code>`;
    else if (c.t) body = `<span>${c.t}</span>`;
    else if (c.lines) body = `<ul class="steps-list">${c.lines.map((t, i) => `<li data-k="${L}-${i}">${t}</li>`).join("")}</ul>`;
    else if (c.block) body = codeBlock(c.block, L);
    const inline = c.c || c.t;
    h += `<div class="choice" data-l="${L}" role="button" tabindex="0" aria-pressed="false">
      <div class="top"><span class="let">(${L})</span>${inline ? body : ""}<span class="tag"></span></div>
      ${inline ? "" : body}</div>`;
  }
  h += `</div><div id="revealbox"></div>`;
  $("question").innerHTML = h;
  $("question").querySelectorAll(".choice").forEach(b => {
    const toggle = () => {
      const L = b.dataset.l;
      state.picks[state.q] = state.picks[state.q] === L ? undefined : L;
      paint();
    };
    b.addEventListener("click", toggle);
    b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); } });
  });
}

function totalSteps() { return Q[state.q].steps.length + 1; }

function paint() {
  const q = Q[state.q], n = totalSteps(), last = state.s === n - 1;
  const st = last ? {} : q.steps[state.s];
  const pick = state.picks[state.q];
  document.querySelectorAll(".qbtn").forEach((b, i) => {
    b.setAttribute("aria-current", i === state.q ? "true" : "false");
    b.classList.toggle("done", !!state.done[i]);
  });
  document.querySelectorAll("#question [data-k]").forEach(el => el.classList.toggle("now", (st.hl || []).includes(el.dataset.k)));
  document.querySelectorAll("#question .choice").forEach(b => {
    const L = b.dataset.l, tag = b.querySelector(".tag");
    b.classList.toggle("focus", !last && (st.ch || []).includes(L));
    b.classList.toggle("picked", pick === L);
    b.classList.toggle("correct", last && L === q.answer);
    b.classList.toggle("wrong", last && pick === L && L !== q.answer);
    b.setAttribute("aria-pressed", pick === L ? "true" : "false");
    tag.className = "tag";
    tag.textContent = "";
    if (last && L === q.answer) { tag.classList.add("ans"); tag.textContent = pick === L ? "Answer · your pick" : "Answer"; }
    else if (pick === L) { tag.classList.add("you"); tag.textContent = "Your pick"; }
  });
  // variables, with changes marked
  const prev = state.s > 0 && !last ? (q.steps[state.s - 1].vars || {}) : {};
  const vars = st.vars;
  if (vars && Object.keys(vars).length) {
    $("vars").innerHTML = Object.entries(vars).map(([k, v]) => {
      const chg = state.s > 0 && JSON.stringify(prev[k]) !== JSON.stringify(v);
      return `<span class="var${chg ? " chg" : ""}"><span class="k">${esc(k)}</span><span class="v">${esc(String(v))}</span></span>`;
    }).join("");
  } else $("vars").innerHTML = `<span class="novars">${last ? "Trace complete." : "No values to track on this step."}</span>`;
  $("stepno").textContent = last ? "Answer" : `Step ${state.s + 1} of ${n - 1}`;
  if (last) {
    let verdict = "";
    if (pick) verdict = pick === q.answer
      ? `<p class="verdict ok">You picked (${pick}). Nice work!</p>`
      : `<p class="verdict no">You picked (${pick}). Look back at the step for (${pick}) to see where it goes wrong.</p>`;
    $("say").innerHTML = `<div class="reveal"><div class="big">The answer is (${q.answer})</div><p>${q.why}</p>${verdict}</div>`;
    state.done[state.q] = true;
    document.querySelectorAll(".qbtn")[state.q].classList.add("done");
  } else {
    $("say").innerHTML = `<p>${st.say}</p>`;
  }
  $("barfill").style.width = ((state.s + 1) / n * 100) + "%";
  $("back").disabled = state.s === 0 && state.q === 0;
  $("next").textContent = last ? (state.q < Q.length - 1 ? "Next question →" : "Finished") : "Next →";
  $("next").disabled = last && state.q === Q.length - 1;
  $("jump").disabled = last;
  const firstNow = document.querySelector("#question .now, #question .choice.focus");
  if (firstNow && !inView(firstNow)) firstNow.scrollIntoView({ block: "center", behavior: "smooth" });
}
function inView(el) {
  const r = el.getBoundingClientRect();
  const tr = document.querySelector(".trace").getBoundingClientRect();
  const bottom = innerWidth <= 900 ? Math.min(innerHeight, tr.top) : innerHeight;
  return r.top >= 0 && r.bottom <= bottom;
}

function go(qi, si) {
  const changed = qi !== state.q || !$("question").innerHTML;
  state.q = qi; state.s = si;
  if (changed) { renderQuestion(); try { history.replaceState(null, "", "#q" + (qi + 1)); } catch (e) {} }
  paint();
}
function next() {
  if (state.s < totalSteps() - 1) go(state.q, state.s + 1);
  else if (state.q < Q.length - 1) { go(state.q + 1, 0); window.scrollTo({ top: 0, behavior: "smooth" }); }
}
function back() {
  if (state.s > 0) go(state.q, state.s - 1);
  else if (state.q > 0) go(state.q - 1, Q[state.q - 1].steps.length);
}
$("next").addEventListener("click", next);
$("back").addEventListener("click", back);
$("jump").addEventListener("click", () => go(state.q, totalSteps() - 1));
$("restart").addEventListener("click", () => go(state.q, 0));
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); next(); }
  else if (e.key === "ArrowLeft") { e.preventDefault(); back(); }
  else if (e.key === "]" && state.q < Q.length - 1) go(state.q + 1, 0);
  else if (e.key === "[" && state.q > 0) go(state.q - 1, 0);
});
buildNav();
const m = location.hash.match(/^#q(\d+)$/);
const startQ = m ? Math.min(Math.max(+m[1] - 1, 0), Q.length - 1) : 0;
state.q = -1;
go(startQ, 0);
</script>
